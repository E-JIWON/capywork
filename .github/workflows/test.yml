name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: scripts/bundle.sh "$RUNNER_TEMP/CapyWork.app" && test -x "$RUNNER_TEMP/CapyWork.app/Contents/MacOS/CapyWork"
      - run: swift test
